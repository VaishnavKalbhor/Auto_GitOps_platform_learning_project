apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Multi-source Application: one source is the kube-prometheus-stack Helm
  # chart from its official repo, the other is this Git repo (referenced as
  # `ref: values`) purely so the values file underneath it is diffable in
  # normal PRs instead of being inlined into this manifest.
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "62.*"
      helm:
        valueFiles:
          - $values/monitoring/kube-prometheus-values.yaml
    - repoURL: https://github.com/<your-github-username>/autogitops-platform.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
